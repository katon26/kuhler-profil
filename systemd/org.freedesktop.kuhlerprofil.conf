<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root user can own the KühlerProfil service -->
  <policy user="root">
    <allow own="org.freedesktop.kuhlerprofil"/>
    <allow send_destination="org.freedesktop.kuhlerprofil"/>
    <allow receive_sender="org.freedesktop.kuhlerprofil"/>
  </policy>

  <!-- Allow any local user to call methods and receive signals from kuhlerprofil -->
  <policy context="default">
    <allow send_destination="org.freedesktop.kuhlerprofil"
           send_interface="org.freedesktop.kuhlerprofil"/>
    <allow send_destination="org.freedesktop.kuhlerprofil"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.kuhlerprofil"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow receive_sender="org.freedesktop.kuhlerprofil"/>
  </policy>
</busconfig>
