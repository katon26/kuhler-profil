<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root user can own the KoolThing service -->
  <policy user="root">
    <allow own="org.freedesktop.koolthing"/>
    <allow send_destination="org.freedesktop.koolthing"/>
    <allow receive_sender="org.freedesktop.koolthing"/>
  </policy>

  <!-- Allow any local user to call methods and receive signals from koolthing -->
  <policy context="default">
    <allow send_destination="org.freedesktop.koolthing"
           send_interface="org.freedesktop.koolthing"/>
    <allow send_destination="org.freedesktop.koolthing"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.koolthing"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow receive_sender="org.freedesktop.koolthing"/>
  </policy>
</busconfig>
